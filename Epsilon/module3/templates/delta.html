<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyse Radio Médicales</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #e8f0f8, #d5e5ed);
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            margin-top: 20px;
            font-size: 2.5rem;
            color: #2b6777;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.1);
        }

        .form-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
            width: 90%;
            max-width: 600px;
            animation: fadeIn 1s ease-in-out;
        }

        label {
            font-size: 1.2rem;
            color: #444;
        }

        input[type="file"] {
            margin-top: 10px;
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 100%;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input[type="file"]:focus {
            border-color: #2b6777;
            outline: none;
        }

        .button-container {
            margin-top: 20px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
        }

        button {
            background: linear-gradient(90deg, #2b6777, #3a8d98);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: translateY(1px);
            box-shadow: none;
        }

        .preview-container {
            margin-top: 30px;
            text-align: center;
        }

        .preview-container h2 {
            font-size: 1.5rem;
            color: #2b6777;
        }

        img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 15px;
            margin-top: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        img:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <h1>Analyse d'Images Médicales</h1>

    <div class="form-container">
        <form id="imageForm" action="/psymc" method="post">
            <label for="imageInput">Téléchargez vos images médicales :</label>
            <input type="file" id="imageInput" name="medicalImages" accept="image/*" multiple required>

            <div class="button-container">
                <button type="button" onclick="previewImages()">Prévisualiser</button>
                <button type="button" onclick="predictDisease()">Prédire la Maladie</button>
            </div>
        </form>

        <div class="preview-container" id="previewContainer">
            <h2>Prévisualisation des Images :</h2>
            <!-- Les images téléchargées apparaîtront ici -->
        </div>
    </div>

    <script>
        function previewImages() {
            const input = document.getElementById('imageInput');
            const previewContainer = document.getElementById('previewContainer');
            previewContainer.innerHTML = '<h2>Prévisualisation des Images :</h2>'; // Réinitialiser

            if (input.files.length === 0) {
                alert('Veuillez sélectionner au moins une image.');
                return;
            }

            Array.from(input.files).forEach(file => {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = document.createElement('img');
                    img.src = event.target.result;
                    previewContainer.appendChild(img);
                };
                reader.readAsDataURL(file);
            });
        }

        function predictDisease() {
            const input = document.getElementById('imageInput');

            if (input.files.length === 0) {
                alert('Veuillez télécharger au moins une image pour prédire.');
                return;
            }

            alert('Prédiction en cours à partir des images téléchargées...');
        }
    </script>
</body>
</html>
