<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enregistrement des Symptômes</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #f0f0f0, #d7e1ec);
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            margin-top: 20px;
            font-size: 2.5rem;
            color: #45a049;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.2);
        }

        .form-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
            width: 90%;
            max-width: 600px;
            animation: fadeIn 1s ease-in-out;
        }

        .symptom-checkbox {
            margin: 15px 0;
        }

        label {
            font-size: 1.2rem;
            color: #444;
            margin-left: 10px;
            vertical-align: middle;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: ##45a049;
            vertical-align: middle;
        }

        .button-container {
            margin-top: 30px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
        }

        button {
            background: linear-gradient(90deg, #45a049, #45a049);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: translateY(1px);
            box-shadow: none;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <h1>Enregistrer Symptômes du Patient</h1>

    <div class="form-container">
        <form action="/psymb" method="POST">
            <div class="symptom-checkbox">
                <input type="checkbox" id="shortness_of_breath" name="symptoms" value="shortness_of_breath">
                <label for="shortness_of_breath">Essoufflement</label>
            </div>
            <div class="symptom-checkbox">
                <input type="checkbox" id="depressive_symptoms" name="symptoms" value="depressive_symptoms">
                <label for="depressive_symptoms">Symptômes dépressifs ou psychotiques</label>
            </div>
            <div class="symptom-checkbox">
                <input type="checkbox" id="sharp_chest_pain" name="symptoms" value="sharp_chest_pain">
                <label for="sharp_chest_pain">Douleur thoracique aiguë</label>
            </div>
            <div class="symptom-checkbox">
                <input type="checkbox" id="dizziness" name="symptoms" value="dizziness">
                <label for="dizziness">Vertiges</label>
            </div>
            <div class="symptom-checkbox">
                <input type="checkbox" id="insomnia" name="symptoms" value="insomnia">
                <label for="insomnia">Insomnie</label>
            </div>
            <div class="symptom-checkbox">
                <input type="checkbox" id="abnormal_movements" name="symptoms" value="abnormal_movements">
                <label for="abnormal_movements">Mouvements involontaires anormaux</label>
            </div>

            <div class="button-container">
                <button type="submit">Ajouter</button>
                <button type="button" onclick="exportData()">Exporter les Données</button>
                <button type="button" onclick="predict()">Prédire</button>
            </div>
        </form>
    </div>
</body>
</html>
