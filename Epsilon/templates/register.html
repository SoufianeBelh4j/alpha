<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #333;
        }

        label {
            font-size: 14px;
            margin-bottom: 5px;
            color: #555;
            display: block;
            text-align: left;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        input:focus, select:focus {
            border-color: #007BFF;
            outline: none;
        }

        button {
            background-color: #007BFF;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Inscription</h1>
        <form method="POST" action="/register">
            <label for="name">Nom d'utilisateur :</label>
            <input type="text" id="nom" name="nom" required>

            <label for="email">Email :</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Mot de passe :</label>
            <input type="password" id="password" name="password" required>

            <label for="speciality">Spécialité médicale :</label>
            <select id="speciality" name="speciality" required>
                <option value="" disabled selected>Choisissez une spécialité</option>
                <option value="medecine_generale">Médecine générale</option>
                <option value="cardiologie">Cardiologie</option>
                <option value="neurologie">Neurologie</option>
                <option value="pneumologie">Pneumologie</option>
                <option value="gastro-enterologie">Gastro-entérologie</option>
                <option value="nephrologie">Néphrologie</option>
                <option value="endocrinologie">Endocrinologie</option>
                <option value="dermatologie">Dermatologie</option>
                <option value="oncologie">Oncologie</option>
            </select>

            <button type="submit">S'inscrire</button>
        </form>
        <br>
        <a href="/">Retour à la connexion</a>
    </div>
</body>
</html>
